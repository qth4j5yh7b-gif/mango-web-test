<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Favourite Fruit</title>
    <style>
        body {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            background-color: #fff8e1;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #0cdbdb;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #76f925;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 24px;
        }

        .emoji {
            font-size: 100px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🥭</div>
        <h1>Mango</h1>
        <p>
            <i><b>My favourite fruit is mango because it’s sweet, juicy, and delicious!</b> </i>
        </p>
    </div>
</body>
</html>
